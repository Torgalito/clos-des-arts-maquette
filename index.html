        :root {
            /* ==========================================================================
     TOKENS OFFICIELS CLOS DES ARTS (RÉF. HTTPS://CLOSDESARTS.BE/)
     Harmonie HSL & Rigueur Direction Artistique
     ========================================================================== */

            /* Nuancier HSL Teinté & Harmonique (Sean Adams) */
            --cda-h-dark: 64;
            --cda-s-dark: 32%;
            --cda-l-dark: 25%;

            --cda-h-black: 63;
            --cda-s-black: 17%;
            --cda-l-black: 19%;

            --cda-h-accent: 17;
            --cda-s-accent: 60%;
            --cda-l-accent: 56%;

            --cda-h-sand: 45;

            /* Couleurs Fondamentales du site de référence */
            --clos-des-arts_colors---color--dark: #52542b;
            /* Vert bronze / olive profond */
            --clos-des-arts_colors---color--black: #373828;
            /* Noir d'encre chaud */
            --clos-des-arts_colors---color--light: #fffdf6;
            /* Ivoire albâtre chaud */
            --clos-des-arts_colors---color--bg-1: #fcfaf5;
            /* Blanc cassé solaire (surface) */
            --clos-des-arts_colors---color--bg-2: #f0eee9;
            /* Fond général doux */
            --clos-des-arts_colors---color--bg-3: #d6d1c4;
            /* Neutre structurel / bordure */
            --clos-des-arts_colors---color--accent: #d1724b;
            /* Terracotta solaire signature */
            --clos-des-arts_colors---color--red: #cc5441;
            /* Rouge brique */

            /* Déclinaisons Teintées HSL (stricte interdiction des gris neutres) */
            --clos-des-arts_colors---color--dark-16: rgba(82, 84, 43, 0.16);
            --clos-des-arts_colors---color--dark-32: rgba(82, 84, 43, 0.32);
            --clos-des-arts_colors---color--dark-48: rgba(82, 84, 43, 0.48);
            --clos-des-arts_colors---color--dark-64: rgba(82, 84, 43, 0.64);
            --clos-des-arts_colors---color--light-16: rgba(255, 253, 246, 0.16);
            --clos-des-arts_colors---color--light-32: rgba(255, 253, 246, 0.32);
            --clos-des-arts_colors---color--light-48: rgba(255, 253, 246, 0.48);
            --clos-des-arts_colors---color--light-64: rgba(255, 253, 246, 0.64);
            --clos-des-arts_colors---color--accent-64: rgba(209, 114, 75, 0.64);

            /* Variables Sémantiques */
            --ink: var(--clos-des-arts_colors---color--black);
            --ink-secondary: var(--clos-des-arts_colors---color--dark);
            --accent: var(--clos-des-arts_colors---color--accent);
            --line: var(--clos-des-arts_colors---color--dark-16);
            --line-subtle: rgba(82, 84, 43, 0.08);
            --muted: #6f7158;
            /* Contraste WCAG AA > 4.5:1 sur #f0eee9 */
            --muted-soft: #8e907a;

            /* Typographie & Échelle Modulaire */
            --clos-des-arts---font--main: 'Made Mirage', Georgia, serif;
            --clos-des-arts---font--secondary: 'Urbanist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --clos-des-arts---font-weight--normal: 400;
            --clos-des-arts---font-weight--medium: 500;
            --clos-des-arts---font-weight--semi-bold: 600;

            /* Baseline & Espacements */
            --clos-des-arts---baseline: 24px;
            --clos-des-arts_spacing---site-padding--main: 32px;

            /* Rayons Plastiques du Site */
            --clos-des-arts---radius--full: 100vw;
            --clos-des-arts---radius--32: 32px;
            --clos-des-arts---radius--24: 24px;
            --clos-des-arts---radius--20: 20px;
            --clos-des-arts---radius--16: 16px;
            --clos-des-arts---radius--12: 12px;
            --clos-des-arts---radius--8: 8px;
            --clos-des-arts---radius--4: 4px;

            /* Physique de Mouvement & Transitions DA */
            --cda-ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --cda-transition-fast: 160ms var(--cda-ease-out);
            --cda-transition: 260ms var(--cda-ease-out);
            --cda-transition-slow: 420ms var(--cda-ease-out);

            /* Ombres Portées Teintées */
            --cda-shadow-sm: 0 2px 8px rgba(55, 56, 40, 0.05);
            --cda-shadow-md: 0 8px 24px rgba(55, 56, 40, 0.08);
            --cda-shadow-lg: 0 16px 40px rgba(55, 56, 40, 0.12);
            --cda-shadow-active: 0 0 0 4px rgba(209, 114, 75, 0.22), 0 8px 28px rgba(82, 84, 43, 0.14);
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: var(--clos-des-arts_colors---color--bg-2);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .cda {
            background: var(--clos-des-arts_colors---color--bg-2);
            color: var(--ink);
            font: 400 16px/1.5 var(--clos-des-arts---font--secondary);
            letter-spacing: -0.25px;
            min-height: 700px;
            height: 100svh;
            padding: 0 var(--clos-des-arts_spacing---site-padding--main);
            display: flex;
            flex-direction: column;
            isolation: isolate;
        }

        .cda * {
            box-sizing: border-box;
        }

        .cda button,
        .cda a {
            -webkit-tap-highlight-color: transparent;
        }

        .cda button {
            font: inherit;
            color: inherit;
            cursor: pointer;
            border: 0;
            background: none;
        }

        .cda a {
            color: inherit;
            text-decoration: none;
        }

        .cda button:focus-visible,
        .cda a:focus-visible,
        .cda canvas:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
        }

        .cda [hidden] {
            display: none !important;
        }

        .cda h1,
        .cda h2,
        .cda h3,
        .cda p {
            margin: 0;
        }

        /* ==========================================================================
   HEADER & IDENTITÉ ÉDITORIALE
   ========================================================================== */
        .cda-header {
            height: 96px;
            flex: none;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
        }

        .cda-brand {
            font: 400 34px/1 var(--clos-des-arts---font--main);
            color: var(--clos-des-arts_colors---color--dark);
            letter-spacing: -0.8px;
            white-space: nowrap;
            transition: opacity var(--cda-transition);
        }

        .cda-brand:hover {
            opacity: 0.88;
        }

        .cda-brand span {
            display: block;
            font: 600 10px/1.3 var(--clos-des-arts---font--secondary);
            letter-spacing: 2.8px;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 8px;
        }

        .cda-header-label {
            font-size: 14px;
            color: var(--muted);
            letter-spacing: -0.15px;
            font-weight: 400;
        }

        .cda-contact {
            font: 500 13px/1 var(--clos-des-arts---font--secondary);
            letter-spacing: 0.5px;
            color: var(--clos-des-arts_colors---color--dark);
            background: var(--clos-des-arts_colors---color--light);
            border: 1px solid var(--line);
            border-radius: var(--clos-des-arts---radius--full);
            padding: 11px 22px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--cda-shadow-sm);
            transition: background var(--cda-transition), border-color var(--cda-transition), transform var(--cda-transition), box-shadow var(--cda-transition);
        }

        .cda-contact:hover {
            background: #ffffff;
            border-color: var(--clos-des-arts_colors---color--dark-32);
            transform: translateY(-1px);
            box-shadow: var(--cda-shadow-md);
        }

        .cda-contact span {
            font-size: 15px;
            line-height: 1;
            transition: transform var(--cda-transition);
        }

        .cda-contact:hover span {
            transform: translate(2px, -2px);
        }

        /* ==========================================================================
   WORKSPACE & COMPOSITION ASYMÉTRIQUE
   ========================================================================== */
        .cda-workspace {
            flex: 1;
            min-height: 0;
            padding-top: 28px;
            padding-bottom: 20px;
            display: grid;
            grid-template-columns: 360px minmax(0, 1fr);
            gap: 32px;
        }

        .cda-sidebar {
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .cda-eyebrow {
            font: 600 11px/1.3 var(--clos-des-arts---font--secondary);
            letter-spacing: 1.8px;
            text-transform: uppercase;
        }

        .cda-intro>.cda-eyebrow {
            color: var(--accent);
            margin-bottom: 12px;
        }

        .cda-intro h1 {
            font: 400 clamp(36px, 3vw, 44px)/1.05 var(--clos-des-arts---font--main);
            color: var(--clos-des-arts_colors---color--dark);
            letter-spacing: -0.8px;
            margin-bottom: 14px;
        }

        .cda-intro-meta {
            font-size: 14px;
            color: var(--muted);
            font-weight: 400;
            line-height: 1.4;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .cda-intro-meta i {
            height: 4px;
            width: 4px;
            border-radius: 50%;
            background: var(--clos-des-arts_colors---color--dark-32);
        }

        /* Filtres de statut : Pilules absolues */
        .cda-filters {
            display: flex;
            gap: 6px;
            border-bottom: 0;
            margin: 24px 0 16px;
            padding-bottom: 12px;
        }

        .cda-filters button {
            font: 500 13px/1.4 var(--clos-des-arts---font--secondary);
            letter-spacing: 0.2px;
            padding: 8px 16px;
            border-radius: var(--clos-des-arts---radius--full);
            white-space: nowrap;
            color: var(--muted);
            border: 1px solid transparent;
            transition: color var(--cda-transition), background var(--cda-transition), border-color var(--cda-transition), box-shadow var(--cda-transition);
        }

        .cda-filters button:hover {
            color: var(--ink);
            background: rgba(255, 253, 246, 0.6);
        }

        .cda-filters button[aria-pressed="true"] {
            background: var(--clos-des-arts_colors---color--light);
            color: var(--clos-des-arts_colors---color--dark);
            border-color: var(--line);
            box-shadow: var(--cda-shadow-sm);
            font-weight: 600;
        }

        .cda-filters button span {
            font-size: 11px;
            margin-left: 8px;
            opacity: 0.8;
            font-weight: 500;
        }

        /* Liste & Cartes Parcelles */
        .cda-lots {
            min-height: 0;
            overflow: auto;
            overscroll-behavior: contain;
            scrollbar-width: thin;
            scrollbar-color: var(--clos-des-arts_colors---color--bg-3) transparent;
            padding: 2px 10px 14px 2px;
            margin-right: -10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cda-lot {
            padding: 18px 20px !important;
            flex: none;
            width: 100%;
            background: rgba(255, 253, 246, 0.65);
            border: 1px solid var(--line) !important;
            border-radius: var(--clos-des-arts---radius--16);
            text-align: left;
            transition: background var(--cda-transition), border-color var(--cda-transition), transform var(--cda-transition), box-shadow var(--cda-transition);
        }

        .cda-lot:hover {
            background: var(--clos-des-arts_colors---color--light);
            border-color: var(--clos-des-arts_colors---color--dark-32) !important;
            transform: translateY(-1px);
            box-shadow: var(--cda-shadow-sm);
        }

        .cda-lot[aria-pressed="true"] {
            background: var(--clos-des-arts_colors---color--light);
            transform: translateY(-1px);
        }

        .cda-lot-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
        }

        .cda-lot-num {
            font-weight: 600;
            color: var(--clos-des-arts_colors---color--dark);
        }

        .cda-status {
            font-size: 11px;
            letter-spacing: 0.4px;
            font-weight: 500;
            padding: 3px 10px;
            border-radius: var(--clos-des-arts---radius--full);
            background: #52542b;
            color: var(--muted);
        }

        .cda-status[data-status="available"] {
            color: #f0eee9;
            font-weight: 600;
        }

        .cda-status[data-status="sold"] {
            color: var(--muted);
            background: rgba(82, 84, 43, 0.06);
        }

        .cda-lot-name {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font: 400 24px/1.15 var(--clos-des-arts---font--main);
            color: var(--clos-des-arts_colors---color--dark);
            gap: 10px;
        }

        .cda-lot-name span:last-child {
            font: 400 18px var(--clos-des-arts---font--secondary);
            color: var(--muted);
        }

        .cda-lot-meta {
            display: block;
            font-size: 13px;
            line-height: 1.4;
            color: var(--muted);
            margin-top: 8px;
        }

        .cda-lot[data-status="sold"] {
            opacity: 0.72;
        }

        .cda-lot[data-status="sold"]:hover {
            opacity: 0.95;
        }

        .cda-lot[aria-pressed="true"] .cda-lot-name {
            color: var(--ink);
        }

        .cda-sidebar-foot {
            font-size: 11px;
            color: var(--muted);
            padding-top: 14px;
            flex: none;
            letter-spacing: 0.2px;
        }

        /* ==========================================================================
   SCÈNE 3D & CANVAS
   ========================================================================== */
        .cda-scene {
            min-width: 0;
            position: relative;
            background: #e8e6df;
            border-radius: var(--clos-des-arts---radius--24);
            overflow: hidden;
        }

        .cda-scene-title {
            position: absolute;
            left: 28px;
            top: 28px;
            z-index: 5;
            pointer-events: none;
        }

        .cda-scene-title .cda-eyebrow {
            font-size: 10px;
            color: var(--muted);
            margin-bottom: 6px;
            letter-spacing: 1.5px;
        }

        .cda-scene-title h2 {
            font: 400 clamp(24px, 2.2vw, 28px)/1.15 var(--clos-des-arts---font--main);
            color: var(--clos-des-arts_colors---color--dark);
            letter-spacing: -0.4px;
        }

        /* Onglets de vue : Pill Dock translucide */
        .cda-view-tabs {
            display: flex;
            gap: 4px;
            position: absolute;
            right: 24px;
            top: 24px;
            z-index: 6;
            background: rgba(255, 253, 246, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--line);
            padding: 5px;
            border-radius: var(--clos-des-arts---radius--full);
            box-shadow: var(--cda-shadow-sm);
        }

        .cda-view-tabs button {
            font: 500 13px/1 var(--clos-des-arts---font--secondary);
            padding: 8px 15px;
            border-radius: var(--clos-des-arts---radius--full);
            white-space: nowrap;
            color: var(--muted);
            transition: all var(--cda-transition);
        }

        .cda-view-tabs button:hover {
            color: var(--ink);
            background: rgba(255, 255, 255, 0.6);
        }

        .cda-view-tabs button[aria-pressed="true"] {
            background: var(--clos-des-arts_colors---color--light);
            color: var(--clos-des-arts_colors---color--dark);
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(55, 56, 40, 0.08);
        }

        .cda-canvas-wrap {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .cda-canvas-wrap canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: grab;
            outline: none;
        }

        .cda-canvas-wrap canvas:active {
            cursor: grabbing;
        }

        .cda-pins {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .cda-pin {
            position: absolute;
            pointer-events: auto;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--clos-des-arts_colors---color--light) !important;
            box-shadow: 0 3px 10px rgba(55, 56, 40, 0.12);
            border: 1.5px solid var(--clos-des-arts_colors---color--dark-32) !important;
            font: 600 12px/1 var(--clos-des-arts---font--secondary) !important;
            color: var(--clos-des-arts_colors---color--dark) !important;
            transform: translate(-50%, -50%);
            display: grid;
            place-items: center;
            padding: 0;
            transition: transform var(--cda-transition), box-shadow var(--cda-transition), background var(--cda-transition), border-color var(--cda-transition);
            z-index: 2;
        }

        .cda-pin:hover {
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 4px 14px rgba(55, 56, 40, 0.2);
            border-color: var(--clos-des-arts_colors---color--dark) !important;
            z-index: 4;
        }

        .cda-pin[aria-pressed="true"] {
            background: var(--accent) !important;
            color: #fffdf6 !important;
            border-color: #fffdf6 !important;
            box-shadow: 0 0 0 5px rgba(209, 114, 75, 0.3), 0 6px 18px rgba(82, 84, 43, 0.25);
            transform: translate(-50%, -50%) scale(1.15);
            z-index: 5;
        }

        .cda-pin[data-status="sold"] {
            color: #8a8a76 !important;
            background: #eeece3 !important;
            border-color: #c4c2b2 !important;
            box-shadow: none;
        }

        .cda-map-label {
            position: absolute;
            pointer-events: none;
            font: 500 11px/1.2 var(--clos-des-arts---font--secondary);
            letter-spacing: 0.5px;
            color: var(--clos-des-arts_colors---color--dark);
            white-space: nowrap;
            transform: translate(-50%, -50%);
            background: rgba(240, 238, 233, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--line);
            border-radius: var(--clos-des-arts---radius--full);
            padding: 4px 11px;
            box-shadow: var(--cda-shadow-sm);
        }

        /* Contrôles Caméra Flottants */
        .cda-camera-controls {
            position: absolute;
            right: 24px;
            top: 92px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--line);
            border-radius: var(--clos-des-arts---radius--12);
            background: rgba(255, 253, 246, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            overflow: hidden;
            box-shadow: var(--cda-shadow-sm);
        }

        .cda-camera-controls button {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            font-size: 20px;
            color: var(--clos-des-arts_colors---color--dark);
            transition: background var(--cda-transition), color var(--cda-transition);
        }

        .cda-camera-controls button:hover {
            background: #ffffff;
            color: var(--ink);
        }

        .cda-camera-controls button+button {
            border-top: 1px solid var(--line);
        }

        .cda-camera-controls svg {
            width: 18px;
            height: 18px;
        }

        .cda-compass {
            position: absolute;
            left: 28px;
            bottom: 76px;
            width: 44px;
            height: 62px;
            color: var(--muted);
            pointer-events: none;
            z-index: 4;
            display: grid;
            justify-items: center;
            align-content: start;
        }

        .cda-compass span {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--clos-des-arts_colors---color--dark);
            line-height: 1;
        }

        .cda-compass svg {
            width: 38px;
            height: 38px;
            transform-origin: 50% 50%;
        }

        .cda-scene-bottom {
            position: absolute;
            bottom: 22px;
            left: 28px;
            right: 28px;
            z-index: 5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            pointer-events: none;
        }

        .cda-legend {
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 11px;
            color: var(--muted);
            font-weight: 500;
        }

        .cda-legend>span {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .cda-dot {
            width: 9px;
            height: 9px;
            background: #bac5a0;
            border: 1px solid #969f7d;
            border-radius: 50%;
        }

        .cda-dot-sold {
            background: #d9dacb;
